[package]
name = "hub-core"
description = "Agent Hub core: Python-compatible primitives (json, repr, fnmatch, YAML, dotenv, pydantic-style validation), domain types and safe file helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
hex.workspace = true
hmac.workspace = true
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
time.workspace = true

# The OS-only parts (random bytes, unix file helpers, errno names) are compiled for native targets only, so the pure
# checks (YAML, models, dotenv, settings, config checks) also build for wasm32-unknown-unknown (crates/hub-wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true
nix.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
