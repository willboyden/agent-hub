name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install (frozen lockfile)
        run: uv sync --frozen --python 3.13
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Type check (strict)
        run: uv run --frozen mypy src
      - name: Tests (offline, fakes and temp dirs)
        run: uv run --frozen pytest -q
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/backend-req.txt"
          uvx pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/backend-req.txt"

  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: knowledge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install (frozen lockfile)
        run: uv sync --frozen --python 3.13
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Type check (strict)
        run: uv run --frozen mypy src
      - name: Tests (live-marked tests are skipped without AK_LIVE=1)
        run: uv run --frozen pytest -q
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/knowledge-req.txt"
          uvx pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/knowledge-req.txt"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests (no dependencies to install)
        run: npm test
